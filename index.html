<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trollbabe — tavolo online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@400;500;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EBEA; --paper2:#D8DFDE; --paper3:#C8D2D1;
  --ink:#14171C; --ink2:#454B54;
  --fjord:#1D4C5C; --fjord-t:#D2E3E8;
  --rune:#A92630; --rune-t:#F3DADC;
  --ok:#2C6948; --ok-t:#D6E8DC;
  --serif:'Alegreya',Georgia,'Times New Roman',serif;
  --sans:'Alegreya Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --disp:'Uncial Antiqua','Alegreya',Georgia,serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161B; --paper2:#1A2027; --paper3:#262E37;
    --ink:#E4E9E8; --ink2:#A4ADB3;
    --fjord:#7FB9CD; --fjord-t:#1B3640;
    --rune:#F07F85; --rune-t:#3B2024;
    --ok:#74C197; --ok-t:#1B3326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161B; --paper2:#1A2027; --paper3:#262E37;
  --ink:#E4E9E8; --ink2:#A4ADB3;
  --fjord:#7FB9CD; --fjord-t:#1B3640;
  --rune:#F07F85; --rune-t:#3B2024;
  --ok:#74C197; --ok-t:#1B3326;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{height:100%}
#game{display:flex;flex-direction:column}
.muted{color:var(--ink2)}
.hint{font-family:var(--sans);font-size:.88rem;color:var(--ink2);margin:.25rem 0 .6rem;line-height:1.4}
.k{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--ink2);margin-bottom:.2rem}

/* ----- schermata iniziale ----- */
#start{overflow:auto;padding:1.4rem 1rem 2rem}
.start-in{max-width:880px;margin:0 auto}
.title{font-family:var(--disp);font-weight:400;font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;margin:.5rem 0 .6rem;letter-spacing:.01em}
.lede{font-size:1.15rem;max-width:34rem;margin:0 0 1.4rem}
.msg{background:var(--rune-t);border:2px solid var(--rune);padding:.5rem .8rem;margin:0 0 1rem;font-family:var(--sans)}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1rem;margin-bottom:1rem}
.card{background:var(--paper2);border:2px solid var(--ink);padding:1rem 1.1rem;margin-bottom:.9rem}
.cards2 .card{margin-bottom:0}
.card h2{font-family:var(--disp);font-weight:400;font-size:1.35rem;margin:0 0 .7rem}
.card.slim{padding:.6rem .8rem}
.gl{list-style:none;margin:0;padding:0}
.gl li{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;border-top:1px dashed var(--ink2)}
.gl li:first-child{border-top:0}
.gl li span{flex:1;font-family:var(--sans);color:var(--ink2)}

/* ----- controlli ----- */
.fld{margin:0 0 .7rem}
.fld label{display:block;font-family:var(--sans);font-size:.85rem;font-weight:700;margin-bottom:.2rem}
.fld input,.fld textarea{width:100%;background:var(--paper);border:2px solid var(--ink);padding:.45rem .6rem;border-radius:0;font-size:1rem;line-height:1.4}
.fld textarea{resize:vertical;min-height:3.2rem}
.fld input:focus,.fld textarea:focus,.btn:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid var(--fjord);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.btn{font-family:var(--sans);font-weight:700;font-size:.98rem;border:2px solid var(--ink);background:var(--paper);padding:.45rem .9rem;cursor:pointer;border-radius:0;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{background:var(--rune);color:#fff;border-color:var(--ink)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{padding:.25rem .65rem;font-size:.88rem;box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-size:1.15rem;padding:.6rem 1.4rem}
.btn.ok{background:var(--ok-t);color:var(--ok);border-color:var(--ok)}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{font-family:var(--sans);font-size:.92rem;font-weight:500;background:var(--paper);border:2px solid var(--ink2);padding:.3rem .7rem;cursor:pointer;border-radius:0;text-align:left;line-height:1.25}
.seg button small{display:block;font-weight:400;font-size:.74rem;color:var(--ink2)}
.seg button.on{background:var(--fjord);color:var(--paper);border-color:var(--ink)}
.seg button.on small{color:var(--paper);opacity:.85}
.seg.num button{min-width:2.4rem;text-align:center;font-size:1.05rem}
.seg.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.seg.types button,.seg.items button{flex:1 1 150px}

/* ----- barra alta ----- */
.top{display:flex;align-items:center;gap:.7rem;padding:.5rem .9rem;border-bottom:2px solid var(--ink);flex:0 0 auto}
.brand{font-family:var(--disp);font-size:1.25rem}
.top .code{font-family:var(--sans);font-weight:700;border:2px solid var(--ink);padding:0 .45rem;letter-spacing:.12em}
.top .info{flex:1;font-family:var(--sans);font-size:.9rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer{width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--ink2);background:transparent}
.peer.on{background:var(--ok);border-color:var(--ok)}

/* ----- tavolo ----- */
.main{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
#log{flex:1;overflow:auto;padding:1rem 1rem .5rem}
.e{max-width:44rem;margin:0 0 .9rem}
.e p{margin:0;font-size:1.08rem;line-height:1.55}
.e .who{font-family:var(--sans);font-size:.8rem;font-weight:700;margin-bottom:.1rem}
.e .who i{font-weight:400;color:var(--ink2);font-style:normal}
.e.gm{border-left:4px solid var(--ink);padding-left:.8rem}
.e.tb{border-left:4px solid var(--fjord);padding-left:.8rem;margin-left:1.2rem}
.e.tb .who{color:var(--fjord)}
.e.scene{border-top:2px solid var(--ink);padding-top:.5rem;margin-top:1.4rem}
.e.scene h3{font-family:var(--disp);font-weight:400;font-size:1.25rem;margin:0 0 .3rem}
.e.sys{font-family:var(--sans);font-size:.88rem;color:var(--ink2);text-align:center;font-style:italic}
.e.ooc{font-family:var(--sans);font-size:.85rem;color:var(--ink2);border:1px dashed var(--ink2);padding:.2rem .5rem}
.e.cflt{font-family:var(--sans);border:2px solid var(--rune);background:var(--rune-t);padding:.4rem .7rem}
.e.roll{display:flex;align-items:center;gap:.6rem;font-family:var(--sans);font-size:.9rem}
.d10{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2.3rem;background:var(--ink);color:var(--paper);font-weight:800;font-size:1rem;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);padding-top:.1rem}
.e.roll.win .d10{background:var(--ok)}.e.roll.lose .d10{background:var(--rune)}
.e.roll.win,.rn.win{color:var(--ok)}.e.roll.lose,.rn.lose{color:var(--rune)}
.rn{display:flex;align-items:center;gap:.5rem;font-family:var(--sans);font-weight:700;margin:.3rem 0}
.rn .d10{background:var(--ink)}

/* tracker del conflitto */
.trk{flex:0 0 auto;border-top:2px solid var(--ink);padding:.45rem .9rem .55rem;background:var(--paper)}
.trk-h{font-family:var(--sans);font-size:.9rem}
.trk-s{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;font-family:var(--sans);font-size:.82rem;margin:.2rem 0}
.sq{display:inline-flex;gap:.2rem;vertical-align:middle;margin-left:.2rem}
.sq i{width:.8rem;height:.8rem;border:2px solid var(--ink)}
.sq.win i.f{background:var(--ok);border-color:var(--ok)}.sq.lose i.f{background:var(--rune);border-color:var(--rune)}
.path{display:flex;align-items:stretch;gap:.2rem;overflow-x:auto;padding:.15rem 0}
.bx{flex:1 0 5.6rem;border:2px solid var(--ink2);border-radius:255px 12px 225px 12px/12px 225px 12px 255px;padding:.3rem .7rem;font-family:var(--sans);font-size:.78rem;line-height:1.25;color:var(--ink2);display:flex;flex-direction:column;justify-content:center}
.bx .bt{font-weight:700}.bx.skip{opacity:.4;border-style:dashed}
.bx.past{background:var(--paper3)}
.bx.cur{border:3px solid var(--ink);color:var(--ink);background:var(--paper2)}
.bx.cur.win{border-color:var(--ok);background:var(--ok-t)}.bx.cur.lose{border-color:var(--rune);background:var(--rune-t)}
.ar{align-self:center;font-size:1.2rem;color:var(--ink2)}

/* dock */
#dock{flex:0 0 auto;max-height:52%;overflow:auto;border-top:2px solid var(--ink);background:var(--paper2);padding:.75rem .9rem}
.form h3,.lobby h3{font-family:var(--disp);font-weight:400;font-size:1.15rem;margin:.1rem 0 .3rem}
.form details{margin:.4rem 0}
summary{font-family:var(--sans);font-size:.88rem;cursor:pointer;color:var(--ink2)}
.tips ul{margin:.3rem 0 .6rem 1.1rem;padding:0;font-family:var(--sans);font-size:.88rem}
.turn{font-family:var(--sans);font-size:.82rem;color:var(--ink2);margin-bottom:.4rem}
.note{border:2px solid var(--rune);background:var(--rune-t);padding:.4rem .7rem;margin:.4rem 0;font-family:var(--sans);font-size:.92rem}
.ph{font-family:var(--sans);font-size:.88rem;margin-bottom:.3rem}
.fairbox{border-left:4px solid var(--ink2);padding:.1rem .7rem;margin:.3rem 0 .7rem;background:var(--paper)}
.fairbox p{margin:0}
.rollbox{display:flex;align-items:center;gap:1.1rem}
.die{flex:0 0 auto;width:5rem;height:5.8rem;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800;font-size:1.5rem;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);padding-top:.5rem}
.die.roll{animation:wob .14s linear infinite}
@keyframes wob{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.wait{display:flex;align-items:center;gap:.6rem;font-family:var(--sans);padding:.3rem 0}
.wait.err{display:block;color:var(--rune)}
.dot{width:.65rem;height:.65rem;background:var(--ink2);border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.spin{width:1rem;height:1rem;border:3px solid var(--ink2);border-top-color:var(--fjord);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lobby .code{font-family:var(--disp);font-size:3rem;letter-spacing:.14em;line-height:1.1}
.ooc-in{display:flex;gap:.5rem;margin-top:.7rem;padding-top:.5rem;border-top:1px dashed var(--ink2)}
.e .q{display:none;float:right;min-width:1.7rem;padding:0 .35rem;margin-left:.4rem}
body.chaton .e .q{display:inline-block}
.e .am{float:right;padding:0 .35rem;margin-left:.4rem;font-size:.75rem;opacity:.6}
.e .am:hover,.e .am:focus{opacity:1}
.e .was{font-family:var(--sans);font-size:.8rem;color:var(--ink2)}
.e .was p{font-style:italic}
.e.retcon{font-style:italic}
.chat-log{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0}
.cm{font-family:var(--sans);font-size:.9rem;line-height:1.4;padding:.3rem .55rem;border-left:3px solid var(--ink2)}
.cm p{margin:.1rem 0 0}
.cm.me{border-left-color:var(--fjord);margin-left:1rem}
.cm.gm{border-left-color:var(--ink)}
.cm.ask{border:2px solid var(--rune);background:var(--rune-t)}
.cm .re,.re-on{display:block;font-size:.8rem;color:var(--ink2);font-style:italic}
.re-on{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-top:.5rem}
.wait.ask{display:block;border:2px solid var(--rune);background:var(--rune-t);padding:.4rem .7rem}
.ooc-in input{flex:1;background:var(--paper);border:2px solid var(--ink2);padding:.25rem .5rem;border-radius:0;font-family:var(--sans);font-size:.9rem}

/* laterale */
#side{width:350px;flex:0 0 350px;overflow:auto;border-left:2px solid var(--ink);padding:.8rem}
.tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
.tabs button{flex:1;font-family:var(--sans);font-weight:700;font-size:.9rem;background:transparent;border:2px solid var(--ink2);padding:.25rem;cursor:pointer;border-radius:0}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.side-close{display:none}
.pcname{font-family:var(--disp);font-size:1.25rem;line-height:1.2;margin-bottom:.3rem}
.badge{font-family:var(--sans);font-size:.72rem;font-weight:700;border:2px solid var(--ink2);padding:0 .35rem;vertical-align:middle}
.badge.st-injured{border-color:var(--rune);color:var(--rune)}.badge.st-incap,.badge.st-dead{background:var(--rune);color:#fff;border-color:var(--rune)}
.numrow{display:flex;gap:1rem;align-items:center}
.num{font-family:var(--disp);font-size:3rem;line-height:1;min-width:2.2rem;text-align:center}
.rng{border-collapse:collapse;font-family:var(--sans);font-size:.9rem}
.rng th{text-align:left;padding-right:.9rem;font-weight:500}.rng td{font-weight:700}
.imp{font-family:var(--sans);font-weight:700;font-size:.9rem;margin:.4rem 0 .2rem}
.app{font-size:.95rem;margin:.2rem 0;color:var(--ink2)}
.rr{list-style:none;margin:0;padding:0;font-family:var(--sans);font-size:.9rem}
.rr li{padding:.1rem 0}.rr li.away{color:var(--ink2)}.rr li .row{margin-top:.2rem}.rr li.used{text-decoration:line-through;color:var(--ink2)}.rr li small{color:var(--ink2)}
.card.secret{border-style:dashed}
.card.secret p{margin:.3rem 0;font-size:.95rem}
.rules h4{font-family:var(--sans);font-size:.88rem;margin:.7rem 0 .1rem}.rules h4:first-child{margin-top:0}
.rules p{margin:0;font-size:.93rem}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,2rem);background:var(--ink);color:var(--paper);font-family:var(--sans);padding:.5rem .9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:899px){
  #side{position:fixed;top:0;right:0;bottom:0;width:min(92vw,380px);flex:none;background:var(--paper);z-index:30;transform:translateX(102%);transition:transform .2s;padding-top:calc(.8rem + env(safe-area-inset-top,0px));padding-bottom:calc(.8rem + env(safe-area-inset-bottom,0px));box-shadow:-6px 0 0 rgba(0,0,0,.25)}
  body.drawer #side{transform:none}
  .side-close{display:block;margin:0 0 .6rem auto}
  #dock{max-height:58%}
  .e.tb{margin-left:.6rem}
}
@media(min-width:900px){.only-m{display:none}}
.col.formmode #log,.col.formmode #tracker{display:none}
.col.formmode #dock{flex:1;max-height:none;border-top:0}
.gen{border:2px dashed var(--ink2);padding:.5rem .8rem .2rem;margin:.4rem 0 .8rem}.gen h4{font-family:var(--sans);font-size:.9rem;margin:0 0 .4rem}
.verdict{border:3px solid var(--rune);background:var(--rune-t);padding:.55rem .8rem;margin:0 0 .7rem;font-family:var(--sans);font-size:.95rem}
.verdict.ok{border-color:var(--ok);background:var(--ok-t)}
.verdict .row{margin:.4rem 0 0}
.e.verdict{max-width:44rem;font-style:normal;text-align:left}
.note.rv{background:var(--paper);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="start" class="screen hidden"></div>
<div id="game" class="screen hidden">
  <header class="top">
    <span class="brand">Trollbabe</span>
    <span class="code" id="t-code"></span>
    <span class="peer hidden" id="t-peer"></span>
    <span class="info" id="t-info"></span>
    <button type="button" class="btn sm only-m" data-act="drawer">Scheda</button>
  </header>
  <div class="main">
    <div class="col">
      <div id="log"></div>
      <div id="tracker"></div>
      <div id="dock"><div id="dock-body"></div></div>
    </div>
    <aside id="side">
      <button type="button" class="btn sm ghost side-close" data-act="drawer">Chiudi</button>
      <div class="tabs">
        <button type="button" class="on" data-act="tab" data-tab="sheet">Scheda</button>
        <button type="button" data-act="tab" data-tab="rules">Regole</button>
        <button type="button" class="hidden" data-act="tab" data-tab="chat">Al GM</button>
        <button type="button" data-act="tab" data-tab="more">Altro</button>
      </div>
      <div id="side-body"></div>
    </aside>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
/* ============================================================
   Strato per l’uso fuori da Claude (GitHub Pages).
   Dentro Claude esiste già window.claude e questo file non fa nulla.
   Fuori, ricrea con lo stesso contratto: db (replicato via PeerJS),
   user, sample (chiave Anthropic dell’utente), room, downloads.
   ============================================================ */
(function(){
if(window.claude)return;
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=n=>Math.random().toString(36).slice(2,2+(n||4));

/* ---------- archivio locale ---------- */
const store=new Map();
const listeners=new Set();
const parentOf=p=>p.split('/').slice(0,-1).join('/');
const isShared=p=>p.indexOf('games/')===0;
const isPrivate=p=>p.indexOf('data/users/')===0;
const codeOf=p=>{const m=/^games\/([A-Za-z0-9]+)/.exec(p);return m?m[1]:null;};
function loadAll(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf('tb:g:')===0){const o=JSON.parse(localStorage.getItem(k));Object.keys(o.docs||{}).forEach(p=>store.set(p,o.docs[p]));}
    }
    const pv=ls.get('tb:priv');
    if(pv){const o=JSON.parse(pv);Object.keys(o).forEach(p=>store.set(p,o[p]));}
  }catch(e){}
}
const dirty=new Set();let dirtyPriv=false,pt=null;
function markDirty(p){
  if(isPrivate(p))dirtyPriv=true;else{const c=codeOf(p);if(c)dirty.add(c);}
  clearTimeout(pt);pt=setTimeout(flush,250);
}
function flush(){
  dirty.forEach(c=>{const docs={};store.forEach((v,p)=>{if(codeOf(p)===c)docs[p]=v;});ls.set('tb:g:'+c,JSON.stringify({docs:docs}));});
  dirty.clear();
  if(dirtyPriv){const o={};store.forEach((v,p)=>{if(isPrivate(p))o[p]=v;});ls.set('tb:priv',JSON.stringify(o));dirtyPriv=false;}
}
window.addEventListener('pagehide',flush);window.addEventListener('beforeunload',flush);
function merge(a,b){
  const o=Object.assign({},a);
  Object.keys(b).forEach(k=>{
    const v=b[k];
    o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?merge(a[k],v):v;
  });
  return o;
}
function notify(path){
  listeners.forEach(l=>{
    if(((l.kind==='doc'&&l.path===path)||(l.kind==='col'&&l.path===parentOf(path)))&&!l.pending){
      l.pending=true;
      setTimeout(()=>{l.pending=false;if(l.alive)l.fn();},0);
    }
  });
}
function apply(op,path,data){
  if(op==='delete')store.delete(path);
  else if(op==='update'){const d=store.get(path);if(!d)return false;store.set(path,merge(d,clone(data)));}
  else store.set(path,clone(data));
  markDirty(path);notify(path);return true;
}
function write(op,path,data){
  const ok=apply(op,path,data);
  if(op==='update'&&!ok)throw {code:'invalid_argument',message:'documento inesistente'};
  if(isShared(path))net.send({t:'w',op:op,path:path,data:op==='delete'?null:data});
}
const snapDoc=p=>{const d=store.get(p);return {id:p.split('/').pop(),exists:d!==undefined,data:()=>d===undefined?undefined:clone(d)};};
const colSnap=path=>{
  const keys=[];store.forEach((v,k)=>{if(parentOf(k)===path)keys.push(k);});keys.sort();
  const docs=keys.map(snapDoc);
  return {docs:docs,size:docs.length,empty:!docs.length};
};
const leases=new Map();
function docRef(path){
  const n=path.split('/').length;if(n%2)throw new TypeError('percorso di documento non valido: '+path);
  return {
    id:path.split('/').pop(),path:path,
    async get(){return snapDoc(path);},
    async set(d){write('set',path,d);},
    async update(d){write('update',path,d);},
    async delete(){write('delete',path);},
    async acquire(o){const l=leases.get(path),t=Date.now();if(l&&l.exp>t&&l.holder!==o.holder)return {acquired:false};leases.set(path,{holder:o.holder,exp:t+((o&&o.ttlMs)||30000)});return {acquired:true,holder:o.holder};},
    onSnapshot(next){
      const l={kind:'doc',path:path,alive:true,pending:false,fn:()=>next(snapDoc(path))};
      listeners.add(l);setTimeout(()=>{if(l.alive)l.fn();},0);
      return ()=>{l.alive=false;listeners.delete(l);};
    },
    collection(sub){return colRef(path+'/'+sub);}
  };
}
function colRef(path){
  const n=path.split('/').length;if(!(n%2))throw new TypeError('percorso di collezione non valido: '+path);
  const q={path:path,
    doc(id){return docRef(path+'/'+(id||rid(8)));},
    async add(d){const r=q.doc();await r.set(d);return r;},
    async get(){return colSnap(path);},
    onSnapshot(next){
      const l={kind:'col',path:path,alive:true,pending:false,fn:()=>next(colSnap(path))};
      listeners.add(l);setTimeout(()=>{if(l.alive)l.fn();},0);
      return ()=>{l.alive=false;listeners.delete(l);};
    },
    where(){return q;},orderBy(){return q;},limit(){return q;}};
  return q;
}

/* ---------- collegamento diretto tra i browser (PeerJS) ---------- */
const PEER_PREFIX='trollbabe-';
const net={
  peer:null,conn:null,code:null,isHost:false,gotSync:null,myPresence:null,remotePresence:null,pl:new Set(),timer:null,
  send(msg){try{if(this.conn&&this.conn.open)this.conn.send(msg);}catch(e){}},
  snapshotFor(code){const docs={};store.forEach((v,p)=>{if(codeOf(p)===code)docs[p]=v;});return docs;},
  mergeSync(docs){
    Object.keys(docs||{}).forEach(path=>{
      const theirs=docs[path],mine=store.get(path);
      if(path.split('/').length===2){   // documento di gioco: vince la versione più avanzata
        if(!mine||theirs.seq>mine.seq||(theirs.seq===mine.seq&&theirs.rev!==mine.rev&&String(theirs.rev)>String(mine.rev)))apply('set',path,theirs);
      }else if(!store.has(path))apply('set',path,theirs);
    });
  },
  allowed(uid){
    // l'host accetta solo chi ha un posto, oppure chiunque finché ne resta uno libero
    const g=store.get('games/'+this.code);
    if(!g)return true;
    const seats=['gm','tb'].map(x=>g.seats[x]).filter(x=>x.kind==='human');
    return seats.some(x=>!x.uid)||seats.some(x=>x.uid===uid);
  },
  onData(d,c){
    if(!d||typeof d!=='object')return;
    if(this.isHost&&c&&!c.verified){
      if(d.t!=='sync'||d.code!==this.code||!this.allowed(d.uid)){try{c.close();}catch(e){}return;}
      c.verified=true;
      if(this.conn&&this.conn!==c){try{this.conn.close();}catch(e){}}
      this.conn=c;
      this.mergeSync(d.docs);
      try{c.send({t:'sync',code:this.code,docs:this.snapshotFor(this.code)});if(this.myPresence)c.send({t:'p',p:this.myPresence});}catch(e){}
      this.emitPeers();
      return;
    }
    if(d.t==='sync'){
      if(d.code===this.code)this.mergeSync(d.docs);
      if(this.gotSync){const f=this.gotSync;this.gotSync=null;f();}
    }else if(d.t==='w'){
      if(d.path&&codeOf(d.path)===this.code&&isShared(d.path))apply(d.op,d.path,d.data);
    }else if(d.t==='p'){this.remotePresence=d.p||null;this.emitPeers();}
  },
  peerList(){
    const l=[{isMe:true,presence:this.myPresence}];
    if(this.conn&&this.conn.open&&(!this.isHost||this.conn.verified))l.push({isMe:false,presence:this.remotePresence});
    return l;
  },
  emitPeers(){const c={peers:this.peerList()};this.pl.forEach(f=>{try{f(c);}catch(e){}});},
  attach(c){
    if(!this.isHost)this.conn=c;
    c.on('open',()=>{
      if(this.isHost)return;            // l'host risponde solo dopo aver verificato chi si presenta
      this.send({t:'sync',code:this.code,uid:ls.get('tb:cid')||'',docs:this.snapshotFor(this.code)});
      if(this.myPresence)this.send({t:'p',p:this.myPresence});
      this.emitPeers();
    });
    c.on('data',d=>this.onData(d,c));
    c.on('close',()=>{
      if(this.conn===c){
        this.conn=null;this.remotePresence=null;this.emitPeers();
        if(!this.isHost&&this.code){clearTimeout(this.timer);this.timer=setTimeout(()=>this.connectGuest().catch(()=>{}),4000);}
      }
    });
    c.on('error',()=>{});
  },
  startHost(){
    return new Promise((res,rej)=>{
      let done=false;const fin=(f,v)=>{if(!done){done=true;f(v);}};
      const go=()=>{
        try{
          const p=new Peer(PEER_PREFIX+this.code);this.peer=p;
          p.on('open',()=>fin(res));
          p.on('connection',c=>{this.attach(c);});
          p.on('error',e=>{
            if(e.type==='unavailable-id'){if(!done){try{p.destroy();}catch(_){}setTimeout(go,3000);}}
            else if(!done)fin(rej,new Error('Collegamento non riuscito ('+e.type+')'));
          });
        }catch(e){fin(rej,e);}
      };
      go();
      setTimeout(()=>fin(rej,new Error('Il servizio di collegamento (PeerJS) non risponde.')),25000);
    });
  },
  connectGuest(){
    return new Promise((res,rej)=>{
      let done=false;const fin=(f,v)=>{if(!done){done=true;f(v);}};
      try{
        if(this.peer){try{this.peer.destroy();}catch(e){}}
        const p=new Peer();this.peer=p;
        p.on('open',()=>{const c=p.connect(PEER_PREFIX+this.code,{reliable:true});this.gotSync=()=>fin(res);this.attach(c);});
        p.on('error',e=>{
          if(e.type==='peer-unavailable'){
            fin(rej,new Error('Nessuna partita con questo codice è online: chi l’ha creata deve avere la pagina aperta.'));
            if(!this.isHost&&this.code){clearTimeout(this.timer);this.timer=setTimeout(()=>this.connectGuest().catch(()=>{}),5000);}
          }else fin(rej,new Error('Collegamento non riuscito ('+e.type+')'));
        });
      }catch(e){fin(rej,e);}
      setTimeout(()=>fin(rej,new Error('Tempo scaduto nel collegamento.')),15000);
    });
  },
  host(code){this.code=code;this.isHost=true;ls.set('tb:host:'+code,'1');return this.startHost();},
  join(code){
    if(ls.get('tb:host:'+code)==='1')return this.open(code);
    this.closeNet();this.code=code;this.isHost=false;
    return this.connectGuest().catch(e=>{this.close();throw e;});
  },
  open(code){
    if(this.code===code&&this.peer&&!this.peer.destroyed&&(this.isHost||this.conn))return Promise.resolve();
    const g=store.get('games/'+code);
    if(!g||g.seats.gm.kind==='ai'||g.seats.tb.kind==='ai')return Promise.resolve();
    this.closeNet();this.code=code;
    if(ls.get('tb:host:'+code)==='1'){this.isHost=true;return this.startHost().catch(()=>{});}
    this.isHost=false;return this.connectGuest().catch(()=>{});
  },
  closeNet(){
    clearTimeout(this.timer);this.timer=null;
    try{if(this.conn)this.conn.close();}catch(e){}
    try{if(this.peer)this.peer.destroy();}catch(e){}
    this.conn=null;this.peer=null;this.remotePresence=null;this.gotSync=null;
  },
  close(){this.closeNet();this.code=null;this.emitPeers();}
};

function askKey(){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='keymodal';
    d.innerHTML='<div class="km" role="dialog" aria-modal="true"><h2>Chiave Anthropic</h2><p>Le chiamate dell’IA sono a tuo carico. Incolla la tua chiave (sk-ant-…): resta solo in memoria di questa scheda, non viene salvata e non viene mai inviata all’altro giocatore. La ottieni su console.anthropic.com.</p><input type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"><div class="row"><button type="button" class="btn primary" data-k="ok">Usa questa chiave</button><button type="button" class="btn ghost" data-k="no">Annulla</button></div></div>';
    document.body.appendChild(d);
    const inp=d.querySelector('input');inp.focus();
    const end=v=>{d.remove();res(v);};
    d.addEventListener('click',e=>{
      const k=e.target.closest&&e.target.closest('[data-k]');if(!k)return;
      if(k.dataset.k==='no')return end(false);
      const v=inp.value.trim();if(!v){inp.focus();return;}
      KEY=v;end(true);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')d.querySelector('[data-k="ok"]').click();});
  });
}
const sample=async()=>{throw {code:'invalid_request'};};
sample.setKey=askKey;
sample.hasKey=()=>!!KEY;
sample.json=async function(prompt,opts){
  opts=opts||{};
  if(!KEY){const ok=await askKey();if(!ok)throw {code:'not_granted'};}
  const tier=opts.modelTier||'default';
  const model=tier==='quick'?'claude-haiku-4-5':tier==='complex'?'claude-opus-5':'claude-sonnet-5';
  const body={model:model,max_tokens:16000,messages:[{role:'user',content:prompt}]};
  if(model!=='claude-haiku-4-5'&&tier!=='complex')body.output_config={effort:'low'};
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  }catch(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    throw {code:'network',message:'rete non raggiungibile'};
  }
  if(r.status===401||r.status===403){KEY='';throw {code:'bad_key'};}
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok){let m='';try{m=(await r.json()).error.message;}catch(e){}throw {code:'upstream_error',message:m||('HTTP '+r.status)};}
  const d=await r.json();
  const txt=(d.content||[]).map(x=>x.text||'').join('');
  const i=txt.indexOf('{'),j=txt.lastIndexOf('}');
  if(i<0||j<=i)throw {code:'invalid_json'};
  try{return JSON.parse(txt.slice(i,j+1));}catch(e){throw {code:'invalid_json'};}
};

let chain=Promise.resolve();
function tx(fn,guard){
  const gd=(guard===undefined)?ver():guard;
  const run=async()=>{
    if(!G||(gd!=null&&ver()!==gd))return false;
    const g=clone(G),entries=[];
    const push=(type,who,text,meta)=>entries.push({type:type,who:who||'',text:text||'',meta:meta||null});
    if(fn(g,push)===false)return false;
    await commit(g,entries,G.seq,G);
    return true;
  };
  const p=chain.then(run);
  chain=p.catch(()=>{});
  return p;
}
function deepDiff(a,b){
  const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(!isO(a)||!isO(b))return JSON.stringify(a)===JSON.stringify(b)?undefined:b;
  const d={};let any=false;
  Object.keys(b).forEach(k=>{const r=deepDiff(a[k],b[k]);if(r!==undefined){d[k]=r;any=true;}});
  Object.keys(a).forEach(k=>{if(!(k in b)){d[k]=null;any=true;}});
  return any?d:undefined;
}
async function commit(g,entries,prevSeq,base){
  const col=logCol(g.code);let n=g.logN||0;
  for(const e of entries){
    n++;
    await col.doc(String(n).padStart(6,'0')+'-'+rid(3)).set(JSON.parse(JSON.stringify(Object.assign({},e,{n:n,t:Date.now()}))));
  }
  g.logN=n;g.seq=prevSeq+1;g.rev=rid(5);g.updatedAt=Date.now();
  const out=JSON.parse(JSON.stringify(g));
  if(base){
    // scrivo solo i campi cambiati: due azioni simultanee non si cancellano a vicenda
    const diff=deepDiff(base,out)||{};
    diff.seq=out.seq;diff.rev=out.rev;diff.logN=out.logN;diff.updatedAt=out.updatedAt;
    await gameRef(g.code).update(diff);
  }else await gameRef(g.code).set(out);
  if(G&&G.code===g.code&&G.rev!==out.rev&&G.seq<=out.seq){G=out;render();}
}

}
function beginEnd(g,push,why){g.step='ending';g.endWhy=why;push('sys','',why+' L’avventura volge al termine.');}
function startConflict(g,push,seat,o){
  g.conflict={by:seat,type:o.type,pace:o.pace,goal:o.goal||'',succ:0,fail:0,series:1,box:0,roll:null,kind:null,usedRels:[],
    fair:{gm:'',tb:'',gmOk:false,tbOk:false,turn:'tb',round:0},stage:seat==='tb'?'pace':'goal',departing:!!g.leaving,lastNarr:null};
  g.leaving=false;g.step='conflict';
  push('sys','','Conflict! '+(seat==='tb'?pcName(g):'Il GM')+' dichiara un conflitto '+TYPES[o.type].label+'.');
}
function useItem(g,id){
  const c=g.conflict;
  if(String(id).indexOf('rel:')===0){
    const r=(g.rels||[]).find(x=>x.id===String(id).slice(4)&&!x.dead&&!x.checked);
    if(!r)return null;r.checked=true;c.usedRels.push(r.id);return r.name;
  }
  if(!ITEMS[id]||(g.checked||[]).includes(id))return null;
  g.checked.push(id);return ITEMS[id];
}
function endSeries(g,push,result){
  const c=g.conflict;
  if(result==='success')c.succ++;else c.fail++;
  const need=c.pace,over=g.pc.status==='incap'||g.pc.status==='dead';
  let done=null;
  if(c.succ>=need&&!over)done='success';
  else if(c.fail>=need||over)done='fail';
  if(done){
    c.outcome=done;
    push('sys','','Conflict concluso: Goal '+(done==='success'?'raggiunto':'fallito')+' (Serie riuscite '+c.succ+', fallite '+c.fail+').');
    if(c.usedRels.length){
      c.stage='rels';
      const she=g.pc.status==='injured'?'injured':(g.pc.status==='incap'||g.pc.status==='dead')?'incap':'ok';
      c.relCosts=c.usedRels.map(id=>({id:id,status:relCost(done,she)}));
    }else afterConflict(g,push);
  }else{
    c.series++;c.box=startBox(g);c.sb=c.box;c.stage='step';c.step={gm:null,tb:null};c.kind=null;c.roll=null;
    push('sys','','Serie '+(c.succ+c.fail)+' chiusa: '+c.succ+' riuscite, '+c.fail+' fallite. Si continua.');
  }
}
function afterConflict(g,push){
  const c=g.conflict;
  g.lastConflict={type:c.type,pace:c.pace,goal:c.goal,outcome:c.outcome};
  const dep=c.departing,out=c.outcome;
  g.turn=(c.lastNarr==='gm')?'tb':'gm';
  g.conflict=null;
  if(g.pc.status==='dead'){beginEnd(g,push,'La trollbabe è morta.');return;}
  if(dep&&out==='success'){beginEnd(g,push,'La trollbabe lascia il luogo.');return;}
  g.step=g.pc.status==='incap'?'scene_play':'rel_offer';
  if(g.pc.status==='incap')g.turn='gm';
}
function startSeries(g,push){
  const c=g.conflict;
  push('conflict','','',{type:c.type,pace:c.pace,goal:c.goal,by:c.by});
  push('gm','gm',c.fair.gm,{kind:'fair'});push('tb','tb',c.fair.tb,{kind:'fair'});
  c.stage='roll';c.box=startBox(g);c.sb=c.box;c.roll=null;
}
function addRel(g,o){
  g.rels.push({id:'r'+rid(5),name:o.name,type:o.type,note:o.note||'',checked:false,status:'ok',here:true});
}

function expected(g){
 g=g||G;if(!g)return [];
 if(g.review)return ['gm'];
 if(g.objection)return ['tb'];
 const c=g.conflict;
 switch(g.step){
  case 'tb_create':case 'scene_request':case 'rel_offer':case 'interim':return ['tb'];
  case 'gm_prep':case 'scene_open':case 'rel_approve':case 'ending':return ['gm'];
  case 'scene_play':return [g.turn||'tb'];
  case 'conflict':
   if(!c)return [];
   switch(c.stage){
    case 'goal':case 'roll':case 'narr_tb':case 'decide_tb':case 'rels':return ['tb'];
    case 'pace':case 'narr_gm':return ['gm'];
    case 'fair':return [c.fair.turn||'tb'];
    case 'step':return [c.step&&c.step.gm===null?'gm':'tb'];
   }
 }
 return [];
}

function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rnd(a.length)];return s;}

async function createGame(name,role,other){
 if(other==='ai'&&!sample)throw 'L’IA non è disponibile in questa vista: scegli «Un’altra persona».';
 let code,tries=0;
 do{code=genCode();const s=await gameRef(code).get();if(!s.exists)break;}while(++tries<8);
 const theirs=role==='gm'?'tb':'gm';
 const g={v:1,code:code,createdAt:Date.now(),updatedAt:Date.now(),seq:0,logN:0,
  seats:{},step:other==='ai'?'tb_create':'lobby',scale:1,adv:1,scene:0,turn:'tb',pc:null,rels:[],loc:null,locName:'',checked:[],npcs:[],request:null,conflict:null,leaving:false,reveal:null};
 g.seats[role]={kind:'human',uid:UID,name:name};
 g.seats[theirs]=other==='ai'?{kind:'ai',uid:null,name:'IA'}:{kind:'human',uid:null,name:''};
 ss.set('tb:role:'+code,role);
 if(net&&other==='human')await net.host(code);
 await commit(g,[{type:'sys',who:'',text:'Partita creata. '+(role==='gm'?'GM':'Trollbabe')+': '+name+'. '+(other==='ai'?(role==='gm'?'La trollbabe':'Il GM')+' è l’IA.':'In attesa del secondo giocatore.'),meta:null}],0);
 await addIndex(code,role);
 openGame(code);
}
async function joinGameByCode(code,name){
 code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length<4)throw 'Inserisci il codice della partita.';
 if(net)await net.join(code);
 const ref=gameRef(code);const s=await ref.get();
 if(!s.exists)throw 'Partita non trovata. Controlla il codice.';
 let g=s.data();
 // già al tavolo?
 const mine=['tb','gm'].filter(x=>g.seats[x].uid===UID);
 let role=null;
 const free=['gm','tb'].find(x=>g.seats[x].kind==='human'&&!g.seats[x].uid);
 const takeOther=D.j_other==='take';
 if(mine.length&&!(takeOther&&free))role=mine.length===1?mine[0]:(ss.get('tb:role:'+code)||mine[0]);
 else if(free){
  const lock=db.doc('locks/'+code);
  const r=await lock.acquire({holder:UID,ttlMs:4000});
  if(!r.acquired)throw 'Qualcun altro sta entrando: riprova tra un attimo.';
  const s2=await ref.get();const g2=clone(s2.data());
  if(g2.seats[free].uid)throw 'Il posto è stato appena occupato.';
  g2.seats[free]={kind:'human',uid:UID,name:name};
  g2.step=g2.pc?g2.step:'tb_create';
  role=free;
  await commit(g2,[{type:'sys',who:'',text:name+' si siede al tavolo come '+(free==='gm'?'GM':'trollbabe')+'.',meta:null}],g2.seq||0);
 }else throw 'La partita è al completo.';
 ss.set('tb:role:'+code,role);
 await addIndex(code,role);
 openGame(code);
}

function computeRole(g){
 const pref=ss.get('tb:role:'+g.code);
 if(pref&&g.seats[pref]&&g.seats[pref].uid===UID)return pref;
 const t=g.seats.tb.uid===UID,m=g.seats.gm.uid===UID;
 if(t&&!m)return 'tb';if(m&&!t)return 'gm';if(t&&m)return pref||'tb';return null;
}

function rulesHTML(){
 return '<div class="card slim rules"><h4>Numero</h4><p>Da 2 a 9: più basso, più magia; più alto, più combattimento. Tra un’avventura e l’altra puoi alzarlo o abbassarlo di 1.</p>'+
 '<h4>Tiri (d10)</h4><p><b>Fighting</b>: successo se il d10 è <i>sotto</i> il numero. <b>Magic</b>: <i>sopra</i>. <b>Social</b>: il numero o oltre, dal lato meno probabile (numero fino a 5: da 1 al numero; da 6: dal numero a 10).</p>'+
 '<h4>Conflict</h4><p>Riguarda i personaggi, non la difficoltà. Chi lo dichiara sceglie Action Type e Pace; il Goal lo dice sempre la giocatrice. L’altra parte può spostare il Pace di un livello. Anche un luogo o un oggetto, come il mare in cui ti tuffi, diventa un avversario se qualcuno chiama il conflitto.</p>'+
 '<h4>Fair and clear</h4><p>A turno, trollbabe e GM dicono cosa stanno facendo i loro personaggi; ciascuno accetta o modifica la propria dichiarazione. Si parte quando entrambi accettano. Ciò che il GM non dice qui non entra nel conflitto.</p>'+
 '<h4>Pace</h4><p>Action by action: 3 Serie riuscite (o 3 fallite) su max 5. Clash by clash: 2 su max 3. Entire conflict: una Serie. Ogni Serie è un passo verso il Goal: prima di ogni tiro dici cosa fai, e il tiro decide se ti riesce.</p>'+
 '<h4>Una Serie</h4><p>Tiro iniziale. Se fallisce: scomodata, la narra la giocatrice; se si ferma, la Serie è persa. Altrimenti sceglie un roll-again (una voce non ancora spuntata), dice come l’aiuta e tira di nuovo: fallire dà ferita, poi incapacitata (la narra il GM, ostile), poi un ultimo tiro che può solo attenuare l’incapacità; se fallisce resta la narrazione del GM oppure la giocatrice dichiara la morte.</p>'+
 '<h4>Chi narra</h4><p>Serie riuscita: il GM, con una sola immagine; se il conflitto non è finito, narra solo come ti avvicini al Goal. Serie fallita: la giocatrice. Nessuna nuova informazione: retroscena e poteri dei PNG sono del GM.</p>'+
 '<h4>Roll-again</h4><p>Oggetto portato, alleato improvviso, oggetto trovato, incantesimo ricordato, elemento del terreno, più le Relationship. Ognuno una sola volta per avventura. Un PNG con nome come alleato improvviso richiede il consenso del GM.</p>'+
 '<h4>Ferita</h4><p>Deve avere senso per il conflitto: ferite o sfinimento nel Fighting, contraccolpo mistico nella Magic, orgoglio ferito nel Social, o un colpo alle spalle per ritorsione. Resta finché non c’è una scena di cura. Da ferita ogni Serie parte già dal primo box: al massimo due roll-again.</p>'+
 '<h4>Relationship</h4><p>Si stringono dopo un conflitto con un personaggio presente, più un’interazione. Per i PNG con nome decide il GM. Gli alleati aiutano solo se sono in scena; avversari e amanti sono sempre nei paraggi. Usarle come roll-again le mette a rischio.</p>'+
 '<h4>Scale</h4><p>Limita ciò che la trollbabe riesce a compiere di persona: puoi puntare più in alto, ma riesci solo alla tua misura. La pietra contro il portone ti fa passare, il portone resta in piedi. «Non puoi salvare la città»: ciò che sta sopra il tuo Scale lo decide il GM. Sale di 1 tra un’avventura e l’altra, mai scende.</p></div>';
}

function waitHTML(exp){

  if(!sample)return '<div class="wait err"><p>L’IA non è disponibile in questa vista: aprila dentro Claude e consenti l’uso di Claude.</p></div>';

function oocHTML(){

function dockHTML(){
 const g=G;
 if(!ROLE)return '<p class="muted">Stai guardando questa partita senza un posto al tavolo.</p>';
 if(!g.pc&&g.step!=='lobby'&&g.step!=='tb_create')return '<div class="wait"><span class="dot"></span><span>Sincronizzazione in corso…</span></div>';
 if(ui.amending)return amendHTML();
 if(ui.renaming)return renameHTML();
 if(g.objection&&ROLE==='tb')return objectionHTML()+oocHTML();
 let h='';
 switch(g.step){
  case 'lobby':h=pLobby();break;
  case 'tb_create':h=ROLE==='tb'?pTbCreate():waitHTML(['tb']);break;
  case 'gm_prep':h=ROLE==='gm'?pGmPrep():waitHTML(['gm']);break;
  case 'scene_open':h=ROLE==='gm'?pSceneOpen():waitHTML(['gm']);break;
  case 'scene_play':h=pScenePlay();break;
  case 'scene_request':h=ROLE==='tb'?pSceneRequest():waitHTML(['tb']);break;
  case 'conflict':h=pConflict();break;
  case 'rel_offer':h=ROLE==='tb'?pRelOffer():waitHTML(['tb']);break;
  case 'rel_approve':h=ROLE==='gm'?pRelApprove():waitHTML(['gm']);break;
  case 'ending':h=ROLE==='gm'?pEnding():waitHTML(['gm']);break;
  case 'interim':h=ROLE==='tb'?pInterim():waitHTML(['tb']);break;
 }
 return h+oocHTML();
}

function pConflict(){
 const g=G,c=g.conflict,me=ROLE;if(!c)return '';
 const exp=expected();
 const head='<div class="ph"><b>'+TYPES[c.type].label+'</b> · '+PACES[c.pace].label+' · Goal: <i>'+esc(c.goal||'da dichiarare')+'</i></div>';
 const paceSeg=(n)=>{const p=c.pace;const o=[['keep','Resta '+PACES[p].it]];if(p<3)o.push(['up','Più fine: '+PACES[p+1].it]);if(p>1)o.push(['down','Più rapido: '+PACES[p-1].it]);return seg(n,o,'keep');};
 if(c.stage!=='fair'&&!exp.includes(me))return head+waitHTML(exp);
 switch(c.stage){
  case 'goal':return head+'<div class="form"><h3>Qual è il tuo Goal?</h3><p class="hint">'+esc(TYPES[c.type].desc)+'</p>'+fld('cg_goal','Il tuo Goal',{rows:2,ph:'«mi metto in salvo sulla terraferma», «lo metto al tappeto», «lo calmo»…'})+goalHint()+'<div class="fld"><label>Pace proposto dal GM</label>'+paceSeg('cg_adj')+'</div>'+btn('Conferma','setGoal','primary')+'</div>';
  case 'pace':return head+'<div class="form"><h3>Pace</h3><p class="hint">Puoi lasciarlo com’è o spostarlo di un livello.</p>'+paceSeg('cp_adj')+btn('Conferma','paceAdj','primary')+'</div>';
  case 'fair':{
   const othSeat=me==='gm'?'tb':'gm',mine=c.fair[me],oth=c.fair[othSeat],myTurn=c.fair.turn===me;
   const box=(s,t,ok)=>'<div class="fairbox"><div class="k">'+esc(whoLabel(s))+(ok?' ✓':'')+'</div><p>'+(t?nl(t):'<i class="muted">non ha ancora scritto</i>')+'</p></div>';
   return head+'<div class="form"><h3>Fair and clear</h3><p class="hint">A turno: ciascuno dice cosa sta facendo il proprio personaggio all’inizio del conflitto; l’altro accetta o modifica la propria dichiarazione. Si parte quando entrambi accettano. '+(me==='gm'?'<b>Come GM, di’ qui apertamente cosa si oppone alla trollbabe e cosa può farle del male</b> (avversari, ambiente, magia, anche ciò che finora era nascosto): ciò che non dici adesso non potrai introdurlo dopo.':'')+'</p>'+
    box(othSeat,oth,c.fair[othSeat+'Ok'])+
    (!myTurn?box(me,mine,c.fair[me+'Ok'])+'<p class="hint">Tocca a '+esc(whoLabel(othSeat))+': legge la tua dichiarazione e accetta o modifica la propria.</p></div>':
     fld('fr_text',me==='gm'?'Gli avversari e ciò che può far male':'La tua azione ('+esc(whoLabel(me))+')',{rows:3,def:mine,ph:me==='gm'?'Cosa fanno gli avversari, cosa si oppone, cosa può far male…':(c.type==='magic'?'Magia troll (natura, spiriti: urla, danze, pitture) o umana (formule, testi, rituali calmi)?':'')})+

  case 'step':{

const GM_RULES='Sei il GM di una partita di TROLLBABE (gioco di ruolo fantasy nordico “underground” di Ron Edwards). Scrivi in italiano, con immagini concrete e frasi brevi.\n\n'+
'MONDO. Le trollbabe sono donne enormi (oltre due metri), né troll né umane, con corna; fortissime. Terre di fiordi, nebbie, pini, Età del Ferro. Gli umani (islandesi, celti, nordici) coltivano, navigano, hanno clan e a volte magia dotta. I troll sono enormi, pelosi, cornuti, a volte mangiano persone. I guai nascono da faide, gelosie, tradimenti, ingiustizie antiche e si esprimono anche con maledizioni, mostri, non morti, presagi.\n\n'+
'IL TUO RUOLO. Sei il basso del gruppo: tieni il ritmo.\n'+
'• Nessuna nuova informazione: parti solo da ciò che è già stabilito (preparazione segreta e diario). Niente trama pianificata.\n'+
'• Descrivi ambienti, ciò che è evidente, azioni e parole di tutti i PNG. Non decidi mai cosa fa o dice la trollbabe né i suoi personaggi in Relationship (li gestisce la giocatrice: tu dai solo sfumature e battute).\n'+
'• I tuoi PNG vedono la trollbabe come legata ai loro interessi (opportunità o minaccia); dicono apertamente cosa vogliono, di parte; possono cambiare idea. All’inizio sono turbati e ipersensibili a tutto ciò che tocca gli Stakes; agiscono in modo diretto quando gli eventi cambiano la loro posizione, e disperato quando gli Stakes sembrano sfuggire o quasi raggiunti.\n'+
'• Ricorda: chiunque diventa cattivo se spinto troppo; quasi tutti sono decenti se trattati onestamente; tutti credono di meritare un po’ di più; la trollbabe non è mai neutrale; parentele e amori spingono agli estremi. Usa i successi della trollbabe per scuotere la situazione e i suoi fallimenti per far pesare il potere dei PNG. La prima Relationship che stringe diventa spesso il cardine dell’avventura.\n'+
'• Conflitti: non riguardano la difficoltà (per una trollbabe ciò che un umano fa, anche a stento, è facile) ma i personaggi. TEST DA APPLICARE A OGNI AZIONE DELLA TROLLBABE: metti i panni del personaggio coinvolto e chiediti «mi sta bene che vada come dice lei?». Se la risposta è no (lei lo colpisce, lo uccide, lo deruba, lo inganna, lo costringe, gli porta via o mette a rischio ciò che gli sta a cuore), CHIAMA IL CONFLITTO e non narrare l’esito: il PNG ha diritto di non morire, di non farsi derubare, di non cedere, e lo decidono i dadi. Vale in particolare per i PNG con nome, ma anche un comprimario senza nome che si oppone merita il conflitto. Se invece a nessuno importa e nessuno si oppone, lascia che l’azione semplicemente accada. Le domande per capire le persone NON sono conflitti: i PNG si sfogano e basta.\n'+
'• Action Type: fighting = solo violenza; magic = lenta e flessibile, richiede tempo; social = cambia il comportamento altrui.\n'+
'• Pace: 3 = azione per azione, 2 = scontro per scontro, 1 = intero conflitto in un tiro. Ogni Serie è un passo verso il Goal: prima di ogni tiro tu dici la mossa degli avversari e la trollbabe dice cosa fa; il tiro decide l’esito di quell’azione.\n'+
'• Fair and clear: dichiara apertamente tutto ciò che può opporsi alla trollbabe e farle del male (avversari, ambiente, magia, anche ciò che era nascosto). Ciò che non dici in quella fase non potrai introdurlo dopo: né nei successi, né nelle ferite, né nell’incapacità.\n'+
'• Una scena è definita da luogo e personaggi presenti. Chiudila con un cambio sostanziale di luogo o a una pausa naturale. Il Scale limita ciò che la trollbabe può compiere di persona.\n'+
'• Se narri un successo: una sola immagine forte, nello stile della giocatrice. Se la trollbabe è incapacitata: sii ostile ma coerente.\n'+
'• Gli Stakes si risolvono da soli per la loro tensione: non spingerli, esprimili attraverso i PNG. Non rivelare mai in modo esplicito la preparazione segreta.\n'+
'• Incoerenze: se emerge una contraddizione, correggi un dettaglio minore (età, date, distanze, chi era presente) in modo da salvare la preparazione segreta e ciò che è stato decisivo in gioco; mai gli Stakes, gli esiti o chi ha fatto cosa nel retroscena. Il retcon si dichiara al tavolo, nella chat fuori gioco, non per bocca di un PNG.\n'+
'• Se la trollbabe è ferita o incapacitata, nello STATO trovi come: tienine conto nelle scene seguenti e falla pesare in modo coerente. Una ferita o un’incapacità deve sempre avere senso rispetto al tipo di conflitto (contraccolpo mistico per Magic, ferite o sfinimento per Fighting, orgoglio ferito o ritorsione per Social) e a ciò che è accaduto.\n'+
'• RITMO MORBIDO: lascia sempre spazio alla giocatrice. Una scena si apre con luogo, circostanze immediate e chi c’è (in genere al massimo un PNG che agisce o parla), poi ti fermi in un punto in cui la trollbabe può rispondere. Non incalzare verso gli Stakes: emergono a poco a poco dalle persone, e sta alla giocatrice andare a cercarli. Una sola mossa per volta: niente più PNG o eventi insieme, niente battute che chiedano già alla trollbabe di agire, mai anticipare ciò che farà lei.\n'+
'Scrivi al massimo 60 parole per risposta, salvo diversa indicazione.';
const TB_RULES='Sei la giocatrice che interpreta una trollbabe in una partita di TROLLBABE (gioco di ruolo fantasy nordico “underground” di Ron Edwards). Scrivi in italiano, in modo vivo e conciso.\n\n'+
'La trollbabe è una donna enorme (oltre due metri), né troll né umana, con corna, più forte di qualunque umano. Per lei la difficoltà non è un problema: i conflitti riguardano i personaggi e ciò che vogliono. Il mondo: fiordi, nebbie, pini, Età del Ferro; umani e troll che si detestano; guai di faide, gelosie, tradimenti, maledizioni.\n\n'+
'COME GIOCARLA. Scopri chi è: piacevole o no, violenta o pacifista, costruttiva o destabilizzante. Agisci, giudica, fatti amici e nemici, rischia quando conta. Non inventare ciò che il GM non ha detto (niente nuove informazioni) e non narrare l’esito dei tuoi tentativi: lo narra il GM se riesci; tu solo se fallisci.\n'+
'• Un Goal è un risultato attivo che coinvolge qualcuno o qualcosa che non sei tu; non passivo («sopravvivere»), non un’emozione tua, non troppo specifico, non il solo gesto che avvia il conflitto. Puoi puntare oltre il tuo Scale, ma riesci solo alla tua misura: la pietra contro il portone ti fa passare, il portone resta in piedi.\n'+
'• Action Type: fighting = solo violenza; magic = lenta e flessibile; social = cambia il comportamento altrui. Pace: 3 azione per azione, 2 scontro per scontro, 1 intero conflitto in un tiro. Prima di ogni tiro dici cosa fa la trollbabe: il tiro decide se le riesce.\n'+
'• Se fallisci, la tua scomodità o ferita deve avere senso rispetto al tipo di conflitto (contraccolpo mistico per Magic, ferite o sfinimento per Fighting, orgoglio ferito o ritorsione per Social) e a ciò che è accaduto; poi ricordala nelle scene seguenti.\n'+
'Scrivi al massimo 70 parole per risposta, salvo diversa indicazione.';

function stateText(role,noSecret){
 const g=G,pc=g.pc,L=[];
 L.push('Scale '+g.scale+' ('+SCALES[g.scale-1]+'). Avventura n. '+g.adv+(g.locName?', luogo: '+g.locName:'')+', scena n. '+g.scene+'.');
 if(pc){
  const r=ranges(pc.number);
  L.push('Trollbabe: '+pc.name+', numero '+pc.number+' (Fighting '+rangeText(r.fighting)+', Magic '+rangeText(r.magic)+', Social '+rangeText(r.social)+'). Impressioni: '+IMP_FIGHT[pc.fight]+', '+IMP_MAGIC[pc.magic]+', '+IMP_SOCIAL[pc.social]+'. Capelli: '+pc.hair+'. Corna: '+pc.horns+'. Abiti: '+pc.cloth+'. Equipaggiamento: '+pc.kit+'. Oggetto umano: '+pc.hum+'. Oggetto troll: '+pc.troll+'. Stato: '+STATUS[pc.status]+(pc.hurt?' ('+pc.hurt+')':'')+'.');
 }
 const rels=(g.rels||[]).filter(r=>!r.dead);
 if(rels.length)L.push('Relationship: '+rels.map(r=>r.name+' ('+REL_TYPES[r.type].toLowerCase()+(r.checked?', già usato in questa avventura':'')+(r.status==='injured'?', ferito':'')+(r.type==='ally'?(relHere(r)?', in scena':', fuori scena'):'')+(r.note&&r.note!==r.name?', «'+r.note+'»':'')+')').join('; ')+'.');
 L.push('Roll-again standard già spuntati in questa avventura: '+((g.checked||[]).map(k=>ITEMS[k]).join(', ')||'nessuno')+'.');
 if(g.npcs&&g.npcs.length)L.push('PNG con nome finora: '+g.npcs.map(n=>n.name).join(', ')+'.');
 if(g.request)L.push('Richiesta di scena della giocatrice: '+(g.request.text||'(lascia scegliere al GM)')+(g.request.heal?' — è una scena di cura.':'.'));
 if(g.leaving)L.push('La giocatrice ha dichiarato che la trollbabe lascia il luogo.');
 const c=g.conflict;
 if(c)L.push('Conflict in corso: '+TYPES[c.type].label+', Pace '+c.pace+' ('+PACES[c.pace].label+'), Goal: «'+c.goal+'». Serie riuscite '+c.succ+', fallite '+c.fail+', Serie n. '+c.series+', box attuale: '+BOXES[c.box].t+'.');
 if(role==='gm'&&PRIV&&!noSecret){
  L.push('— PREPARAZIONE SEGRETA (solo per te) —\nDove: '+(PRIV.where||'—')+'\nChi: '+(PRIV.who||'—')+'\nStakes: '+PRIV.stakes+'\nEsito A: '+PRIV.a+'\nEsito B: '+PRIV.b+'\nPersonaggi:\n'+(PRIV.chars||'—')+(PRIV.notes?'\nNote: '+PRIV.notes:''));
 }
 return L.join('\n');
}

function logText(num){
 const am=amendMap(LOG),ref=e=>num?'#'+e.n+' ':'';
 const rows=LOG.filter(e=>e.type!=='amend'&&!isChat(e)).slice(-24).map(e=>{
  const m=e.meta||{},t=textOf(e,am);
  if(e.type==='scene')return ref(e)+'SCENA '+m.scene+' ('+m.loc+') GM: '+t;
  if(e.type==='gm')return ref(e)+'GM: '+t;
  if(e.type==='tb')return ref(e)+pcName(G)+': '+t;
  if(e.type==='sys')return '['+e.text+']';
  if(e.type==='roll')return '[d10='+m.v+' '+TYPES[m.type].label+' numero '+m.n+' → '+(m.ok?'riuscito':'fallito')+']';
  if(e.type==='conflict')return '[CONFLICT '+TYPES[m.type].label+', Pace '+m.pace+', Goal: '+m.goal+']';
  if(e.type==='ooc'&&e.who==='tb'&&!isChat(e))return '[nota fuori gioco della giocatrice: '+e.text+']';
  return '';
 }).filter(Boolean).map(s=>s.length>700?s.slice(0,700)+'…':s);
 return rows.join('\n')||'(ancora niente)';
}

}
const askHelp=()=>(G.ask&&G.ask.at===G.logN)?' Hai già chiesto un chiarimento su questa mossa e la risposta è nei CHIARIMENTI: ora rispondi tu, con l’interpretazione più ragionevole; "ask" resta null.':' Se la mossa della giocatrice è davvero ambigua (non è chiaro a chi parla, se tenta un’azione o dichiara solo un’intenzione, se è una domanda a te come GM e non ai PNG, oppure contraddice la fiction stabilita), invece di rispondere puoi farle UNA domanda breve fuori gioco in "ask", lasciando "text" vuoto. Non usarla per dettagli che puoi decidere tu.';
const TASKS={
 pc_create:()=>'Crea la tua trollbabe. "number" va da 2 a 9: più basso = più brava in magia, più alto = più brava a combattere. Per fight/magic/social usa solo i valori ammessi. "loc" è il numero del luogo verso cui sta camminando: '+LOCS.map(l=>l.id+' '+l.name).join(', ')+'. Per capelli, corna, abiti, equipaggiamento e due oggetti (uno umano, uno troll: personali, non preziosi) scrivi descrizioni brevi e vivide.',
 gm_prep:()=>'Prepara in segreto l’avventura per '+G.locName+' al Scale '+G.scale+' ('+SCALES[G.scale-1]+'). "where": immagini concrete del luogo. "who": chi c’è (umani, troll o entrambi) e cosa fa: nessun luogo è vuoto. "stakes": una persona, luogo o cosa della taglia del Scale che qualcuno vuole e che è in crisi: deve poter cambiare in modo drastico (vita o morte, distruzione o conservazione, diventare altro), non con un semplice cambio di proprietà (NON un obiettivo di trama, NON una missione, NON qualcosa che riguarda la trollbabe). "a" e "b": due esiti concreti e opposti degli Stakes, senza come né perché. Esempio: Stakes «Ree-Shah, ragazza umana cresciuta dai troll, che il vecchio sciamano malato Gallg vuole trasformare in troll, mentre il giovane Oskel è salito sui monti a cacciare il suo primo troll»; esiti «resta con la tribù» / «torna tra gli umani». In "notes" aggiungi anche una breve lista di nomi umani e troll ancora liberi. "characters": 3–5 personaggi con nome e ciò che vogliono, legati tra loro (parentele, rivalità, desideri) in modo da stringere attorno agli Stakes. Il misto umani/troll funziona meglio; ogni tanto un elemento strano che accentui la tensione emotiva degli Stakes. Nei campi di testo scrivi al massimo 60 parole ciascuno.',
 scene_open:()=>(G.scene===0?'È la prima scena: la storia si apre con la trollbabe che cammina verso il luogo; mostra il luogo e al massimo una presenza, senza mettere già in scena la posta in gioco. ':'')+'Apri la scena: dì dove siamo, le circostanze immediate e chi c’è. Massimo 50 parole, al più un PNG che agisce o parla, e fermati dove la trollbabe può rispondere. Non aprire con un PNG che le affida un incarico: mostra la situazione e lascia che sia lei a muoversi. '+(G.scene>0?'Rispetta la richiesta di scena della giocatrice, tranne se qualcuno si sta già muovendo per cercarla: in quel caso inizia nel punto dell’interruzione. ':'')+'In "npcs" elenca i nomi dei PNG con nome che introduci. "heal": true solo se la richiesta era una scena di cura e la concedi (se il luogo la rende problematica, concedila comunque: potrai chiamare un conflitto).',
 gm_respond:()=>'È il tuo turno di GM. Una sola mossa, massimo 50 parole, che lasci alla giocatrice il tempo di rispondere (niente eventi a catena, un solo PNG che parla alla volta). Reagisci a ciò che la trollbabe ha appena fatto o detto: descrivi ciò che si vede e le azioni e parole dei PNG (di parte, espliciti su ciò che vogliono). Applica il test dei Conflitti: se a un personaggio non sta bene che l’azione di lei vada come dichiara, o un gesto mette sotto stress il suo rapporto con gli Stakes, o un PNG agisce contro di lei, chiama il conflitto: "conflict" con type e pace (altrimenti null). Se lo chiami, fermati PRIMA dell’esito: descrivi solo l’istante dell’azione e la reazione del PNG, mai il risultato (niente «cade morto», «la scure lo colpisce»). Se la scena è a una pausa naturale o i personaggi hanno cambiato luogo, "end_scene": true. Se gli Stakes hanno raggiunto una condizione finale, "end_adventure": true. Se la trollbabe è incapacitata, chiudi la scena. Se la giocatrice ha deciso di lasciare il luogo, decidi se qualcuno cerca di fermarla (conflict) oppure "end_adventure": true. In "npcs" i nomi dei nuovi PNG con nome.'+askHelp()+objHelp(' In scena vale anche: azioni e parole dei PNG le decidi tu, non la giocatrice.'),
 table_talk:()=>'Sei al tavolo, fuori dal gioco: la giocatrice ti parla da persona a persona (la sua domanda è nelle NOTE), non è la trollbabe che parla ai PNG. Rispondi come GM, in prima persona, senza narrare e senza far parlare i PNG. Chiarisci la fiction già stabilita (età, distanze, chi è presente, cosa si vede o si sente). Se ti fa notare un’incoerenza o un errore, riconoscilo e correggi la fiction in modo esplicito («Hai ragione: …»): la correzione vale da ora in poi. Puoi fissare piccoli dettagli coerenti come faresti al tavolo, ma non rivelare la preparazione segreta (Stakes, esiti, retroscena, segreti dei PNG): se la domanda tocca un segreto, dì che si può scoprire in gioco. Non fare mosse, non far avanzare la scena, non chiamare conflitti. Massimo 60 parole.'+tableTalkMore(),
 tb_act:()=>'È il tuo turno: dì o fai qualcosa di coerente con chi è la tua trollbabe e con ciò che sta succedendo. Se vuoi un conflitto (cioè agisci per ottenere qualcosa da qualcuno o contro qualcuno), compila "conflict" con type, pace e goal (null altrimenti). "leave": true solo se vuoi davvero lasciare il luogo. "ask_end": true se la scena ti sembra conclusa.',
 tb_request:()=>'La scena è finita. Dì dove vuoi andare o cosa vuoi fare nella prossima scena (una frase). "heal": true se sei ferita o incapacitata e vuoi che sia una scena di cura.',
 goal:()=>'Il GM ha dichiarato un conflitto '+TYPES[G.conflict.type].label+'. Dichiara il tuo Goal: un risultato attivo che coinvolge qualcun altro o qualcosa, detto in generale, non passivo e non troppo specifico.',
 fair_gm:()=>'Fair and clear: descrivi cosa fanno i PNG avversari all’inizio di questo conflitto e dichiara apertamente tutto ciò che si oppone alla trollbabe e può farle del male (avversari, ambiente, magia, anche ciò che finora era nascosto): ciò che non dici adesso non potrai introdurlo dopo. Descrivi cosa stanno facendo e cosa si oppone, non cosa succederà: niente esiti né conseguenze anticipate. Massimo 70 parole.'+fairTurn('gm')+objHelp(),
 fair_tb:()=>'Fair and clear: descrivi cosa fa la tua trollbabe all’inizio di questo conflitto (azione di apertura, vivida). '+(G.conflict.type==='magic'?'Dì se è magia troll (natura, elementi, spiriti: si spoglia, ulula, danza, dipinge, mangia qualcosa di disgustoso) o umana (formule misurate, testi, principi dotti, rituali calmi come una cerimonia del tè). ':'')+'Non decidere l’esito. Massimo 50 parole.'+fairTurn('tb'),
 review:()=>'Controlla soltanto le ultime frasi della giocatrice, nelle NOTE: sono narrazioni o azioni dentro un conflitto. Se rispettano le regole rispondi {"objection":null}; altrimenti {"objection":"il motivo in una frase, con la regola","of":numero della voce}. '+BREAKS+' Nel conflitto è lei a narrare i propri fallimenti, anche ciò che fanno gli avversari: non è una violazione. Lo è invece narrare un fallimento in cui il Goal avanza comunque. Puoi eccepire anche quando un roll-again «alleato improvviso» usa un PNG con nome (vedi lo STATO) e non vuoi concederlo, oppure quando usa un alleato che non può trovarsi lì.',
 step_gm:()=>{const c=G.conflict;return 'Serie '+c.series+' del conflitto (riuscite '+c.succ+', fallite '+c.fail+' su '+c.pace+'). Prima del tiro, descrivi in una frase la mossa degli avversari in questo passo, usando solo ciò che è stato dichiarato nel Fair and clear. Niente esiti: li decide il dado. "text" vuoto se nessuno agisce. Massimo 40 parole.';},
 step_tb:()=>{const c=G.conflict;return 'Serie '+c.series+' del conflitto (riuscite '+c.succ+', fallite '+c.fail+' su '+c.pace+'). '+(c.step&&c.step.gm?'Il GM: «'+c.step.gm+'». ':'')+'Prima del tiro, dì cosa fa la tua trollbabe in questo passo verso il Goal «'+c.goal+'»: un’azione concreta, che il tiro deciderà se le riesce. Niente esiti, niente informazioni nuove. Massimo 40 parole.';},
 narr_gm:()=>{const c=G.conflict;return c.kind==='success'&&!lastSeries(c,'success')?'Questa Serie è RIUSCITA, ma il conflitto non è finito (Serie riuscite '+(c.succ+1)+' su '+c.pace+' necessarie, fallite '+c.fail+'): il Goal NON è ancora raggiunto. Narra con una sola immagine come la trollbabe si avvicina al Goal in questo passo; avversari e ostacoli dichiarati restano in gioco. Niente nuove azioni di PNG né nuovi conflitti. Massimo 50 parole.':c.kind==='success'?'Il Goal della trollbabe è RIUSCITO. Narra il successo con una sola immagine forte, nello stile con cui la giocatrice l’ha giocata. Niente nuove azioni di PNG né nuovi conflitti. Massimo 50 parole.':'La trollbabe è INCAPACITATA (Goal fallito). Narra in modo ostile ma coerente (con il tipo di conflitto e con ciò che è accaduto) che cosa le succede e come finisce a terra o in balia degli avversari. Usa solo minacce e mezzi già dichiarati nel Fair and clear: niente nuove rivelazioni. Massimo 60 parole.';},
 narr_tb:()=>{const k=G.conflict.kind;return k==='alt_incap'?'Il terzo roll-again è RIUSCITO: il Goal resta perso e la trollbabe è incapacitata, ma tu descrivi in che circostanze meno gravi si ritrova (es. riesce a trascinarsi da un amico). Massimo 50 parole.':'Il tiro è FALLITO ('+(k==='inconv'?'scomodata':'ferita')+'). Narra il fallimento: il Goal sta cedendo (è la sostanza), '+(k==='inconv'?'la scomodità':'la ferita')+' è un dettaglio e deve avere senso per il tipo di conflitto e per ciò che è accaduto. Poi decidi: "continue": false = accetti l’esito, '+(lastSeries(G.conflict,'fail')?'e il Goal fallisce':'questa Serie è persa e si passa alla Serie successiva (Serie fallite '+(G.conflict.fail+1)+' su '+G.conflict.pace+')')+'; true = rischi un roll-again con una delle voci disponibili ("item" = id esatto) e in "how" descrivi come ti aiuta (massimo 40 parole); "text" contiene solo il fallimento. Rischiare ti espone a ferita e incapacità: fallo se il Goal ti sta a cuore.';},
 decide_tb:()=>G.conflict.kind==='incap'?'Sei incapacitata (il GM ha narrato). Puoi accettare ("accept": true) oppure giocare l’ultimo roll-again ("accept": false, "item" = id esatto, "text" = come lo usi, max 40 parole) per attenuare la sorte.':'Il terzo roll-again è fallito: resta la narrazione del GM ("die": false) oppure dichiari la morte della trollbabe ("die": true) e la descrivi in "text" (max 40 parole). Scegli la morte solo se è ciò che il personaggio vuole davvero.',
 rel_offer:()=>'Il conflitto è finito. Puoi legarti a un personaggio che era presente (alleato "ally", avversario "opp", amante "lover"). "form": true solo se ha senso per la tua trollbabe. "name": un PNG con nome già in scena oppure un anonimo ("uno dei guerrieri"). "text": come interagisce con lei subito dopo (max 40 parole).',
 ending:()=>'L’avventura finisce ('+(G.endWhy||'')+'). Scegli quale esito degli Stakes avviene ("a" o "b") se non si è risolto in gioco, e scrivi l’epilogo: cosa succede al luogo su scala più grande (max 90 parole), senza nuove scene.',

// turni successivi del Fair and clear: l’IA rilegge la dichiarazione dell’altro e accetta o aggiorna la propria
function fairTurn(s){
 const f=G.conflict.fair,o=s==='gm'?'tb':'gm',who=s==='gm'?'La trollbabe':'Il GM';
 if(!f[s])return f[o]?' '+who+' ha dichiarato: «'+f[o]+'».':'';
 return ' È di nuovo il tuo turno. '+who+' ha dichiarato: «'+f[o]+'». La tua dichiarazione attuale: «'+f[s]+'». Se resta coerente con la sua rispondi {"accept":true}; se va adattata, rispondi con "text" = la nuova versione completa.';
}
const FAIR_ROUNDS=6;
const BREAKS='Eccepisci solo violazioni chiare delle regole: informazioni nuove (retroscena, poteri, personaggi o minacce mai stabiliti) oppure un Goal già fallito ritentato nella stessa scena. Mai su stile, colore, ambiente o presagi: la trollbabe che fallisce può dare la colpa all’ambiente.';
function tableTalkMore(){
 const o=G.objection,e=o&&LOG.find(x=>x._id===o.of);
 return ' Le voci del diario hanno un numero (#n). Se correggi un fatto narrato da te, oltre a dirlo nel "text" metti in "amend" {"of":n,"text":"la voce #n riscritta per intero"}: solo voci del GM o di scena, e solo dettagli minori.'+
  (o?' C’è una tua eccezione aperta sulla voce #'+(e?e.n:'?')+': «'+o.why+'». Se la spiegazione della giocatrice ti convince, metti "withdraw": true; altrimenti dille cosa rettificare.':'');

const objHelp=more=>G.seats.tb.kind!=='human'?'':' Se l’ultima mossa della giocatrice viola le regole, invece di rispondere metti in "objection" il motivo in una frase, con la regola, e lascia "text" vuoto. '+BREAKS+(more||'');

async function raiseObjection(why,of,seq){
 await A.ooc('gm',why,{chat:1,objection:1});
 await tx(g=>{g.review=null;g.objection={of:of,why:why};},seq);
}
const LIGHT=['review','goal','fair_gm','fair_tb','step_gm','step_tb','rel_offer','interim','tb_request','decide_tb'];
const tierFor=t=>(AI.tier==='default'&&LIGHT.indexOf(t)>=0)?'quick':AI.tier;
async function callAI(role,task,schema,extra,own){
 const ch=role==='gm'?chatText():'';
 const prompt=[role==='gm'?GM_RULES:TB_RULES,'=== STATO ===\n'+stateText(role,task==='gm_prep'),'=== DIARIO RECENTE ===\n'+logText(task==='table_talk'||task==='review'),ch?'=== CHIARIMENTI FUORI GIOCO (accordi sulla fiction: valgono) ===\n'+ch:'',extra?'=== NOTE ===\n'+extra:'','=== COMPITO ['+task+'] ===\n'+TASKS[task](),'Rispondi SOLO con un oggetto JSON, senza altro testo, di questa forma:\n'+schema].filter(Boolean).join('\n\n');
 // la chat ha un proprio controller: «Ferma» e la pausa riguardano solo il gioco
 const ctl=new AbortController();if(!own)AI.ctl=ctl;
 try{return await sample.json(prompt,{modelTier:tierFor(task),signal:ctl.signal,cache:false});}
 finally{if(!own)AI.ctl=null;}
}
async function answerChat(text,re){
 const q=re&&LOG.find(e=>e._id===re);
 AI.chatBusy=true;AI.chatErr=null;AI.chatPending=null;render();
 try{
  const r=await callAI('gm','table_talk','{"text":"…","amend":null,"withdraw":false}','Domanda della giocatrice: «'+text+'»'+(q?'\nSi riferisce a questo passaggio: «'+textOf(q)+'»':''),true);
  const t=str(r.text,900);if(!t)throw {code:'empty_completion'};
  await A.ooc('gm',t,{chat:1});
  const a=r.amend,e=a&&byN(a.of),at=a&&str(a.text,1400);
  if(e&&at&&e.who==='gm')await A.amend('gm',e._id,at);
  if(r.withdraw===true&&G.objection)await A.objectionClose();
 }catch(e){AI.chatErr=aiErrText(e);AI.chatPending={text:text,re:re};console.error(e);}
 finally{AI.chatBusy=false;render();}
}
function aiErrText(e){
 const c=e&&e.code;
 if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared')return 'L’uso di Claude è stato negato o non è disponibile per questa pagina. Riabilitalo dalle autorizzazioni e riprova.';
 if(c==='bad_key')return 'La chiave Anthropic non è valida, oppure non ha credito. Impostane un’altra dalla scheda «Altro».';
 if(c==='network')return 'Non riesco a raggiungere Anthropic: controlla la connessione e riprova.';
 if(c==='rate_limited')return 'Troppe richieste o limite di utilizzo raggiunto: attendi un po’ e riprova.';
 if(c==='invalid_json'||c==='empty_completion')return 'L’IA non ha risposto in modo leggibile. Riprova.';
 if(c==='refused')return 'L’IA ha rifiutato questa richiesta. Riprova.';
 return 'Errore dell’IA'+(e&&e.message?': '+e.message:'.')+' Riprova.';
}

 const chars=(Array.isArray(r.characters)?r.characters:[]).slice(0,6).map(c=>str(c&&c.name,40)+' — '+str(c&&c.want,160)).join('\n');

function itemHelp(){return 'Voci disponibili (usa l’id esatto): '+availableItems(G).map(i=>i.id+' = '+i.label).join('; ')+'.';}
function pickItem(x){
 const items=availableItems(G);if(!items.length)return null;
 const s=String(x||'');
 return (items.find(i=>i.id===s)||items.find(i=>i.label.toLowerCase().indexOf(s.toLowerCase())===0&&s)||items[0]).id;

async function fairJob(s,seq){
 const f=G.conflict.fair,obj=s==='gm'&&G.seats.tb.kind==='human';
 if(f[s]&&f.round>=FAIR_ROUNDS){fresh(seq);await A.fairOk(s);return;}
 const r=await callAI(s,'fair_'+s,(f[s]?'{"accept":true} oppure {"text":"…"}':'{"text":"…"}')+(obj?'\nCon un’eccezione aggiungi "objection":"…"':''));fresh(seq);
 const t=str(r.text,700),ob=obj&&str(r.objection,400);
 // un’eccezione nel Fair and clear passa la mano alla trollbabe perché modifichi la sua dichiarazione
 if(ob&&(t||f[s])){await A.ooc('gm',ob,{chat:1,objection:1});await A.fairSay(s,t||f[s]);return;}
 if(f[s]&&(r.accept===true||!t||t===f[s])){await A.fairOk(s);return;}
 if(!t)throw {code:'empty_completion'};
 await A.fairSay(s,t);
}

function nextAIJob(){
 const g=G,c=g.conflict;
 if(g.review)return aiSeat('gm')?J.review:null;
 if(g.objection)return null;
 switch(g.step){
  case 'tb_create':return aiSeat('tb')?J.pcCreate:null;
  case 'gm_prep':return aiSeat('gm')?J.gmPrep:null;
  case 'scene_open':return aiSeat('gm')?J.sceneOpen:null;
  case 'scene_play':if(askOpen(g))return null;if(aiSeat('gm')&&((g.turn||'tb')==='gm'||g.pc.status==='incap'))return J.gmRespond;if((g.turn||'tb')==='tb'&&aiSeat('tb')&&g.pc.status!=='incap')return J.tbAct;return null;
  case 'scene_request':return aiSeat('tb')?J.tbRequest:null;
  case 'rel_offer':return aiSeat('tb')?J.relOffer:null;
  case 'rel_approve':return aiSeat('gm')?J.relApprove:null;
  case 'ending':return aiSeat('gm')?J.ending:null;
  case 'interim':return aiSeat('tb')?J.interim:null;
  case 'conflict':
   if(!c)return null;
   switch(c.stage){
    case 'goal':return aiSeat('tb')?J.goal:null;
    case 'pace':return aiSeat('gm')?J.paceKeep:null;
    case 'fair':{const s=c.fair.turn||'tb';return aiSeat(s)?(s==='gm'?J.fairGM:J.fairTB):null;}
    case 'step':{const s=expected(g)[0];return aiSeat(s)?(s==='gm'?J.stepGM:J.stepTB):null;}
    case 'roll':return aiSeat('tb')?J.roll:null;
    case 'narr_gm':return aiSeat('gm')?J.narrGM:null;
    case 'narr_tb':return aiSeat('tb')?J.narrTB:null;
    case 'decide_tb':return aiSeat('tb')?J.decideTB:null;
    case 'rels':return aiSeat('tb')?J.relsAuto:null;
   }
 }
 return null;
}
AI.tab=rid(8);
// una sola scheda alla volta fa giocare l’IA (lease di 45 s, rinnovato a ogni mossa)
async function driverLease(){
 try{
  const r=await db.doc('locks/'+CODE+'-ai').acquire({holder:UID+':'+AI.tab,ttlMs:45000});
  return !!(r&&r.acquired);
 }catch(e){return true;}
}
async function aiTick(){
 if(!G||!sample||AI.busy||AI.paused||!isDriver())return;
 if(AI.failedSeq===ver())return;
 const job=nextAIJob();if(!job)return;
 AI.busy=true;
 const got=await driverLease();
 AI.busy=false;
 if(!got){setTimeout(aiTick,6000);return;}
 if(!G||AI.paused||AI.busy)return;
 const seq=ver();
 AI.busy=true;AI.err=null;AI.label=job.label;lastKey='';render();
 try{await job.run(seq);}
 catch(e){
  if(e==='STALE'||(e&&e.code==='cancelled')){}
  else{AI.failedSeq=seq;AI.err=aiErrText(e);console.error(e);}
 }
 finally{
  AI.busy=false;AI.ctl=null;lastKey='';
  if(G&&ver()===seq&&!AI.err&&!AI.paused){AI.failedSeq=seq;AI.err='L’IA non è riuscita ad agire. Riprova.';}
  render();
  if(G&&ver()!==seq)setTimeout(aiTick,60);
 }
}
